<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tom's Chicken - Table Refill</title>
    
    <link href="Bootstrap/Content/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root { --toms-orange: #f57d10ff; --toms-dark: #212529; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; padding-bottom: 90px; }
        
        .navbar { box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .mobile-container { max-width: 600px; margin: 0 auto; padding: 15px; }

        .login-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 30px 20px; text-align: center; }

        .menu-card {
            background: white; border-radius: 15px; border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow: hidden;
            display: flex; flex-direction: column; padding: 15px; margin-bottom: 15px;
        }
        
        .flavor-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #eee; }
        .flavor-row:last-child { border-bottom: none; padding-bottom: 0; }
        
        .qty-btn { background: white; border: 1px solid var(--toms-orange); color: var(--toms-orange); width: 32px; height: 32px; border-radius: 50%; font-weight: bold; display: flex; align-items: center; justify-content: center; padding: 0; }
        .qty-btn:active { background: var(--toms-orange); color: white; }
        .qty-display { width: 30px; text-align: center; font-weight: bold; font-size: 1.1rem; }

        .status-card { background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); padding: 30px 20px; text-align: center; border-top: 5px solid var(--toms-orange); }
        .active-order-list { background: #f8f9fa; border-radius: 10px; padding: 15px; text-align: left; font-family: monospace; font-size: 1.1rem; color: #555; margin-top: 15px; }

        .floating-bottom { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); z-index: 1000; }
        .btn-orange { background-color: var(--toms-orange); color: white; border-radius: 50px; font-weight: bold; border: none; }
        .btn-orange:hover { background-color: #d1660a; color: white; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container mobile-container py-0">
            <span class="navbar-brand fw-bold fs-4" style="color: var(--toms-orange);">
                Tom's<span class="text-dark">Chicken</span>
            </span>
        </div>
    </nav>

    <!-- STEP 1: QR LOGIN -->
    <div id="loginSection" class="container mobile-container mt-4">
        <div class="login-card">
            <i class="fa-solid fa-qrcode fa-4x mb-3" style="color: var(--toms-orange);"></i>
            <h3 class="fw-bold mb-2">Table Access</h3>
            <p class="text-muted small mb-4">Please enter the <b>UNLI-XXXX</b> code provided by the staff.</p>
            
            <input type="text" id="unliCode" class="form-control form-control-lg text-center fw-bold mb-4" placeholder="UNLI-XXXX" style="letter-spacing: 2px; text-transform: uppercase; border-radius: 10px;">
            <button id="verifyBtn" class="btn btn-orange w-100 py-3 fs-5 shadow-sm">Start Refilling</button>
        </div>
    </div>

    <!-- STEP 2: REFILL MENU -->
    <div id="refillSection" class="container mobile-container mt-3 d-none">
        <div class="d-flex justify-content-between align-items-center mb-3 px-2">
            <h5 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-chair" style="color: var(--toms-orange);"></i> <span id="tableDisplay">Table ?</span></h5>
            <span class="badge bg-success">Unli-Promo Active</span>
        </div>

        <div id="orderArea">
            <p class="text-muted small px-2 mb-3">Select your refills below. <br> PS: Please finish your food, leftovers will result in more payments.</p>

            <!-- THIS DIV WILL BE POPULATED BY FIREBASE DATABASE -->
            <div id="dynamicMenuArea" class="mb-5">
                <div class="text-center text-muted py-4">
                    <i class="fa-solid fa-spinner fa-spin fa-2x mb-2"></i>
                    <p>Loading menu...</p>
                </div>
            </div>

            <div class="floating-bottom" id="floatingSubmitArea">
                <button id="submitRefillBtn" class="btn btn-orange w-100 py-3 fs-5 shadow"><i class="fa-solid fa-bell me-2"></i> Send Request</button>
            </div>
        </div>

        <!-- STATUS TRACKER AREA -->
        <div id="statusArea" class="status-card d-none mt-4">
            <div id="statusIcon" class="mb-3"></div>
            <h3 id="statusText" class="fw-bold mb-1">Preparing...</h3>
            <p class="text-muted small mb-3">Your refill is currently processing.</p>
            
            <!-- Shows the items they are waiting for -->
            <div class="active-order-list" id="currentRefillItems"></div>
        </div>
    </div>

    <!-- BOOTSTRAP TOAST FOR NOTIFICATIONS -->
    <div class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1050; width: 100%; max-width: 400px;">
        <div id="systemToast" class="toast align-items-center text-white border-0 w-100" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold fs-6" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="Bootstrap/Scripts/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { db, ref, get, push, onValue } from "./js/firebase-config.js";

        let myTableNum = null;
        let myCurrentCode = ""; // Keep track of the code they used
        let trackedItemsList = []; // Keeps track of all the dynamically generated items
        
        const toastEl = document.getElementById('systemToast');
        const bsToast = new bootstrap.Toast(toastEl, { delay: 3000 });

        // Helper function for Toasts
        function showToast(message, isSuccess = true) {
            document.getElementById('toastMessage').innerText = message;
            if(isSuccess) {
                toastEl.classList.remove('bg-danger');
                toastEl.classList.add('bg-success');
            } else {
                toastEl.classList.remove('bg-success');
                toastEl.classList.add('bg-danger');
            }
            bsToast.show();
        }

        // --- NEW: FETCH MENU DYNAMICALLY FROM FIREBASE ---
        function loadRefillMenu() {
            onValue(ref(db, 'refillMenu'), (snapshot) => {
                const menuArea = document.getElementById('dynamicMenuArea');
                menuArea.innerHTML = '';
                trackedItemsList = []; // Reset tracked items array

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    
                    // Loop through the categories (cat1_chicken, cat2_sides, etc.)
                    for (let catKey in data) {
                        let category = data[catKey];
                        
                        // Start building the HTML card for this category
                        let cardHtml = `
                        <div class="menu-card">
                            <h6 class="fw-bold mb-2"><i class="fa-solid ${category.icon} me-2"></i> ${category.title}</h6>
                        `;

                        // Loop through the items in this category's array
                        for (let i = 0; i < category.items.length; i++) {
                            let itemName = category.items[i];
                            
                            // Create a safe, unique HTML ID by removing spaces and special characters
                            let safeId = "qty_" + itemName.replace(/[^a-zA-Z0-9]/g, "");
                            
                            // Save this to our array so the Submit button knows what to look for
                            trackedItemsList.push({ id: safeId, name: itemName });

                            // Add the row HTML
                            cardHtml += `
                            <div class="flavor-row">
                                <span class="fw-bold text-dark">${itemName}</span>
                                <div class="d-flex align-items-center">
                                    <button class="btn qty-btn" onclick="updateQty('${safeId}', -1)">-</button>
                                    <span class="qty-display" id="${safeId}">0</span>
                                    <button class="btn qty-btn" onclick="updateQty('${safeId}', 1)">+</button>
                                </div>
                            </div>
                            `;
                        }
                        
                        cardHtml += `</div>`; // Close card
                        menuArea.innerHTML += cardHtml; // Inject to screen
                    }
                } else {
                    menuArea.innerHTML = '<p class="text-muted text-center py-4">No menu available. Admin needs to set up the database.</p>';
                }
            });
        }


        // 1. VERIFY UNLI CODE
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const codeInput = document.getElementById('unliCode').value.trim().toUpperCase();
            const btn = document.getElementById('verifyBtn');
            
            if(!codeInput) return showToast("Please enter a code.", false);
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';
            btn.disabled = true;

            const snap = await get(ref(db, 'tables'));
            let found = false;

            if (snap.exists()) {
                snap.forEach(child => {
                    let data = child.val();
                    if (data.code === codeInput && data.status === 'occupied') {
                        myTableNum = child.key;
                        found = true;
                    }
                });
            }

            if (found) {
                myCurrentCode = codeInput; // Save the exact code they used
                document.getElementById('loginSection').classList.add('d-none');
                document.getElementById('refillSection').classList.remove('d-none');
                document.getElementById('tableDisplay').innerText = "Table " + myTableNum;
                
                loadRefillMenu(); // Fetch the dynamic menu!
                listenToMyRefills(); 
                listenToAdminKick(); 

            } else {
                showToast("Invalid or expired code.", false);
                btn.innerText = "Start Refilling";
                btn.disabled = false;
            }
        });

        // KICK USER OUT IF ADMIN ENDS SESSION
        function listenToAdminKick() {
            onValue(ref(db, 'tables/' + myTableNum), (snapshot) => {
                if (snapshot.exists()) {
                    let data = snapshot.val();
                    if (data.status !== 'occupied' || data.code !== myCurrentCode) {
                        showToast("Session ended by Admin. Thank you for dining with us!", false);
                        setTimeout(() => { window.location.reload(); }, 2500);
                    }
                }
            });
        }

        // 2. COUNTER LOGIC
        window.updateQty = function(elementId, change) {
            let el = document.getElementById(elementId);
            let current = parseInt(el.innerText);
            let newVal = current + change;
            if (newVal >= 0 && newVal <= 5) { el.innerText = newVal; }
        }

        // 3. SUBMIT REFILL REQUEST
        document.getElementById('submitRefillBtn').addEventListener('click', async () => {
            let itemsString = "";
            let totalItemsCount = 0;

            // Loop through all dynamically tracked items to see what was ordered
            trackedItemsList.forEach(item => {
                let currentQty = parseInt(document.getElementById(item.id).innerText);
                if (currentQty > 0) {
                    itemsString += `${currentQty}x ${item.name}, `;
                    totalItemsCount += currentQty;
                }
            });

            // Prevent empty submissions
            if (totalItemsCount === 0) {
                return showToast("Please add at least one item.", false);
            }
            
            const btn = document.getElementById('submitRefillBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;

            try {
                await push(ref(db, 'refills'), {
                    tableNum: myTableNum,
                    items: itemsString,
                    status: 'preparing',
                    timestamp: Date.now()
                });

                showToast("Order sent to the kitchen!", true);

                // Reset all counters dynamically
                trackedItemsList.forEach(item => {
                    document.getElementById(item.id).innerText = "0";
                });
                
            } catch (error) {
                showToast("Error sending request.", false);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-bell me-2"></i> Send Request';
                btn.disabled = false;
            }
        });

        // 4. REAL-TIME STATUS LISTENER
        function listenToMyRefills() {
            onValue(ref(db, 'refills'), (snapshot) => {
                let hasActive = false;
                let currentStatus = "";
                let currentItems = "";

                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        let data = child.val();
                        if (data.tableNum === myTableNum && (data.status === 'preparing' || data.status === 'serving')) {
                            hasActive = true;
                            currentStatus = data.status;
                            currentItems = data.items;
                        }
                    });
                }

                const orderArea = document.getElementById('orderArea');
                const statusArea = document.getElementById('statusArea');
                const floatingBottom = document.getElementById('floatingSubmitArea');

                if (hasActive) {
                    orderArea.classList.add('d-none');
                    floatingBottom.classList.add('d-none');
                    statusArea.classList.remove('d-none');
                    
                    document.getElementById('currentRefillItems').innerHTML = currentItems.replace(/, /g, '<br>');

                    if (currentStatus === 'preparing') {
                        document.getElementById('statusIcon').innerHTML = '<i class="fa-solid fa-fire-burner fa-4x text-warning"></i>';
                        document.getElementById('statusText').innerHTML = 'Kitchen is Cooking!';
                        document.getElementById('statusText').className = 'fw-bold text-warning mb-1';
                    } else if (currentStatus === 'serving') {
                        document.getElementById('statusIcon').innerHTML = '<i class="fa-solid fa-bell-concierge fa-4x text-success"></i>';
                        document.getElementById('statusText').innerHTML = 'Waiter is on the way!';
                        document.getElementById('statusText').className = 'fw-bold text-success mb-1';
                    }
                } else {
                    orderArea.classList.remove('d-none');
                    floatingBottom.classList.remove('d-none');
                    statusArea.classList.add('d-none');
                }
            });
        }
    </script>
</body>
</html>
