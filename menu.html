<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tom's Chicken - Menu & Order</title>
    
    <link href="Bootstrap/Content/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root { --toms-orange: #f57d10ff; --toms-dark: #212529; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; padding-bottom: 90px; }
        
        .navbar { box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .mobile-container { max-width: 600px; margin: 0 auto; padding: 15px; }

        /* MENU CARDS */
        .menu-card {
            background: white; border-radius: 15px; border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow: hidden;
            display: flex; align-items: center; padding: 10px; margin-bottom: 15px;
        }
        .menu-img {
            width: 80px; height: 80px; border-radius: 10px; object-fit: cover;
            background-color: #eee;
        }
        .menu-info { flex-grow: 1; padding-left: 15px; }
        .btn-add {
            background-color: #fff3cd; color: var(--toms-orange); border: 1px solid var(--toms-orange);
            border-radius: 50px; font-weight: bold; padding: 5px 15px; transition: 0.2s;
        }
        .btn-add:hover, .btn-add:active { background-color: var(--toms-orange); color: white; }

        /* FLOATING CART BUTTON */
        .floating-cart {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px; background-color: var(--toms-orange); color: white;
            border-radius: 50px; padding: 15px 20px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 10px 20px rgba(245, 125, 16, 0.4); z-index: 1000; cursor: pointer;
        }
        
        /* PAYMENT STYLES */
        .payment-box { background: #fff3cd; border: 1px solid #ffe69c; border-radius: 10px; padding: 15px; text-align: center; }
        .qr-placeholder { width: 150px; height: 150px; background: white; border: 2px dashed #ffc107; margin: 10px auto; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
        .btn-orange { background-color: var(--toms-orange); color: white; border-radius: 50px; font-weight: bold; border: none; }

        /* FLAVOR DROPDOWN (Matches image_5.png) */
        .flavor-select {
            background-color: #ced4da; /* Grey background */
            color: var(--toms-dark);
            border: none;
            border-radius: 50px;
            font-size: 0.8rem;
            padding: 5px 15px;
            font-weight: 600;
            cursor: pointer;
            width: auto;
            display: inline-block;
            margin-right: 10px;
        }
        .flavor-select:focus { outline: none; box-shadow: none; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container mobile-container py-0">
            <a class="navbar-brand fw-bold fs-4" href="index.html" style="color: var(--toms-orange);">
                <i class="fa-solid fa-arrow-left text-dark me-2" onclick="history.back(); return false;"></i> 
                Tom's<span class="text-dark">Chicken</span>
            </a>
        </div>
    </nav>

    <div class="container mobile-container mt-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0">Pickup Menu</h4>
            <span class="badge bg-dark">In-Store Pickup Only</span>
        </div>
        <p class="text-muted small mb-4">Select your items. We'll start preparing them once payment is verified.</p>

        <div id="menuContainer"></div>
    </div>

    <div class="floating-cart d-none" id="cartBtn" data-bs-toggle="modal" data-bs-target="#cartModal">
        <div class="fw-bold"><i class="fa-solid fa-cart-shopping me-2"></i> <span id="cartCount">0</span> Items</div>
        <div class="fw-bold fs-5">₱<span id="cartTotalBtn">0.00</span></div>
    </div>

    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold">Your Order</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="cartItemsList" class="mb-4">
                        </div>
                    
                    <h4 class="fw-bold text-end border-top pt-3 mb-4">Total: ₱<span id="cartTotalModal">0.00</span></h4>

                    <form id="checkoutForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Pickup Time (Approximate)</label>
                            <input type="time" id="pickupTime" class="form-control" required>
                        </div>

                        <div class="payment-box mb-4">
                            <h6 class="fw-bold text-dark mb-1">Pay via GCash / PayMaya</h6>
                            <p class="mb-2 small">Send total amount to: <b>0912 345 6789</b></p>
                            <div class="qr-placeholder">
                                <i class="fa-solid fa-qrcode fa-3x text-muted opacity-50"></i>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold small">Upload Payment Receipt</label>
                            <input type="file" id="orderReceipt" class="form-control" accept="image/*" required>
                            <input type="hidden" id="receiptBase64">
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-orange w-100 py-3 fs-5 shadow-sm">
                            <i class="fa-solid fa-check-circle"></i> Confirm Order
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="Bootstrap/Scripts/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { auth, db, ref, get, onValue, push, onAuthStateChanged } from "./js/firebase-config.js";

        let currentUserName = "Unknown Customer";
        
        // 1. SECURITY: Must be logged in to order
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                alert("Please login to place an order.");
                window.location.href = "login.html";
            } else {
                const snap = await get(ref(db, 'users/' + user.uid));
                if (snap.exists()) {
                    currentUserName = `${snap.val().firstName} ${snap.val().lastName}`;
                }
            }
        });

        // -------------------------------------------------------------
        // --- NEW REAL-TIME MENU LOGIC (From Database) ---
        // -------------------------------------------------------------

        // We listen to the 'menu' node in real-time
        const menuRef = ref(db, 'menu');
        let currentMenuData = {}; // Stores fetched menu data
        let cart = {}; // Shopping cart

        onValue(menuRef, (snapshot) => {
            const menuContainer = document.getElementById('menuContainer');
            menuContainer.innerHTML = ''; // Clear loading/old items
            currentMenuData = {}; // Clear previous data

            if (snapshot.exists()) {
                const data = snapshot.val();
                
                // loop through the items from the database (e.g. item_m1, item_m2)
                for (let dbKey in data) {
                    let item = data[dbKey];
                    currentMenuData[dbKey] = item; // Store for cart use

                    // 1. Generate Flavor Dropdown HTML if "options" exist in DB
                    let flavorDropdownHTML = "";
                    
                    // Check standard if condition (Thesis friendly)
                    if (item.options !== undefined && item.options !== null) {
                        flavorDropdownHTML = `<select class="flavor-select form-select-sm" id="flavor_${dbKey}">`;
                        // Loop through the options array (e.g. Original, Spicy)
                        for(let i=0; i < item.options.length; i++) {
                            flavorDropdownHTML += `<option value="${item.options[i]}">${item.options[i]}</option>`;
                        }
                        flavorDropdownHTML += `</select>`;
                    }

                    // 2. Add Item Card to UI (incorporating flavorDropdownHTML)
                    menuContainer.innerHTML += `
                        <div class="menu-card">
                            <div class="menu-img d-flex align-items-center justify-content-center bg-light">
                                <i class="fa-solid ${item.icon} fa-2x text-warning"></i>
                            </div>
                            <div class="menu-info">
                                <h6 class="fw-bold mb-1">${item.name}</h6>
                                <small class="text-muted d-block mb-1" style="font-size: 0.75rem;">${item.desc}</small>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <span class="fw-bold text-success">₱${item.price}</span>
                                    <div class="d-flex align-items-center">
                                        <!-- NEW: Injection point for dynamic dropdown -->
                                        ${flavorDropdownHTML} 
                                        <!-- Change addToCart to addToCartWithOptions -->
                                        <button class="btn btn-add btn-sm" onclick="addToCartWithOptions('${dbKey}')">
                                            <i class="fa-solid fa-plus"></i> Add
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            } else {
                menuContainer.innerHTML = '<p class="text-center text-muted">Menu is currently unavailable.</p>';
            }
        });

        // --- NEW ADD TO CART WITH OPTION SUPPORT ---
        window.addToCartWithOptions = function(dbKey) {
            const itemData = currentMenuData[dbKey];
            let selectedFlavor = "";

            // 1. Check if a dropdown exists for this item
            const flavorSelect = document.getElementById("flavor_" + dbKey);
            if (flavorSelect) {
                selectedFlavor = flavorSelect.value; // Capture Original, Spicy, etc.
            }

            // 2. Create UNIQUE Cart Key: 
            // This is crucial. A "1pc Chicken (Spicy)" is a different 
            // cart item than "1pc Chicken (Original)".
            // Key format: dbKey_SelectedFlavor (e.g., item_m1_Spicy)
            const cartKey = selectedFlavor ? `${dbKey}_${selectedFlavor}` : dbKey;

            // 3. Simple if logic to add/update qty
            if (cart[cartKey]) {
                cart[cartKey].qty++;
            } else {
                // We add the chosen flavor string to the cart object so we can show it later
                cart[cartKey] = { ...itemData, qty: 1, chosenOption: selectedFlavor };
            }
            updateCartUI();
        }

        // --- REMAINING CART FUNCTIONS (Slightly modified to use cartKey) ---
        window.changeQty = function(cartKey, amount) {
            if (cart[cartKey]) {
                cart[cartKey].qty += amount;
                if (cart[cartKey].qty <= 0) delete cart[cartKey];
                updateCartUI();
            }
        }

        function updateCartUI() {
            let totalItems = 0;
            let totalPrice = 0;
            const cartList = document.getElementById('cartItemsList');
            cartList.innerHTML = '';

            // Using standard for...in loop (Thesis friendly)
            for (let cartKey in cart) {
                let item = cart[cartKey];
                totalItems += item.qty;
                totalPrice += (item.price * item.qty);

                // Show the flavor next to the name in the summary
                let displayName = item.name;
                if (item.chosenOption) {
                    displayName = `${item.name} (${item.chosenOption})`;
                }

                cartList.innerHTML += `
                    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                        <div>
                            <h6 class="mb-0 fw-bold">${displayName}</h6>
                            <small class="text-muted">₱${item.price} x ${item.qty}</small>
                        </div>
                        <div class="d-flex align-items-center">
                            <button type="button" class="btn btn-sm btn-outline-danger px-2" onclick="changeQty('${cartKey}', -1)">-</button>
                            <span class="mx-3 fw-bold">${item.qty}</span>
                            <button type="button" class="btn btn-sm btn-outline-success px-2" onclick="changeQty('${cartKey}', 1)">+</button>
                        </div>
                    </div>
                `;
            }

            document.getElementById('cartCount').innerText = totalItems;
            document.getElementById('cartTotalBtn').innerText = totalPrice.toFixed(2);
            document.getElementById('cartTotalModal').innerText = totalPrice.toFixed(2);

            const cartBtn = document.getElementById('cartBtn');
            if (totalItems > 0) {
                cartBtn.classList.remove('d-none');
            } else {
                cartBtn.classList.add('d-none');
                cartList.innerHTML = '<p class="text-center text-muted my-4">Your cart is empty.</p>';
            }
        }

        // 5. IMAGE CONVERTER (Base64 trick)
        document.getElementById('orderReceipt').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onloadend = function() {
                document.getElementById('receiptBase64').value = reader.result;
            }
            if (file) reader.readAsDataURL(file);
        });

        // 6. SUBMIT ORDER
        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const receiptData = document.getElementById('receiptBase64').value;
            const totalPrice = document.getElementById('cartTotalModal').innerText;
            
            if (!receiptData) return alert("Please upload a receipt.");

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;

            // Format order summary for admin notes
            let orderSummary = "";
            for (let id in cart) {
                orderSummary += `${cart[id].qty}x ${cart[id].name}, `;
            }

            try {
                // A. PUSH TO PAYMENTS TABLE (So Admin can verify it)
                await push(ref(db, 'payments'), {
                    customerName: currentUserName,
                    amount: totalPrice,
                    category: "Online Order",
                    timestamp: Date.now(),
                    status: "pending", 
                    receiptUrl: receiptData
                });

                // B. PUSH TO ORDERS TABLE (For kitchen/pickup tracking)
                await push(ref(db, 'orders'), {
                    customerName: currentUserName,
                    items: orderSummary,
                    total: totalPrice,
                    pickupTime: document.getElementById('pickupTime').value,
                    status: 'preparing',
                    timestamp: Date.now()
                });

                alert("Order placed successfully! We will prepare it once payment is verified.");
                window.location.href = "index.html";

            } catch (error) {
                console.error(error);
                alert("Error: " + error.message);
                btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Confirm Order';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
